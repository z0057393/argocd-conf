apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-ingress
  namespace: blog
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - z0057393.com
      secretName: letsencrypt-prod-pub
    - hosts:
        - www.z0057393.com
      secretName: letsencrypt-prod-www

  rules:
    - host: z0057393.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 80
    - host: www.z0057393.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 80
